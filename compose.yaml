# Passant self-hosted stack: the server and its database. Copy .env.example
# to .env and fill it in first; anchoring targets the VeChain TESTNET.
# For a fully offline development stack, add the solo override:
#   docker compose -f compose.yaml -f compose.solo.yaml up
services:
  server:
    build: .
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      BASE_URL: ${BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-passant}@postgres:5432/postgres
      ISSUER_API_KEY: ${ISSUER_API_KEY}
      ANCHOR_BATCH_WINDOW_MS: ${ANCHOR_BATCH_WINDOW_MS:-600000}
      ANCHOR_BATCH_MAX: ${ANCHOR_BATCH_MAX:-1000}
      VECHAIN_NODE_URL: ${VECHAIN_NODE_URL:-}
      VECHAIN_PUBLIC_NODE_URL: ${VECHAIN_PUBLIC_NODE_URL:-}
      VECHAIN_NETWORK: ${VECHAIN_NETWORK:-}
      VECHAIN_CONTRACT_ADDRESS: ${VECHAIN_CONTRACT_ADDRESS:-}
      OPERATOR_PRIVATE_KEY: ${OPERATOR_PRIVATE_KEY:-}
      SPONSOR_PRIVATE_KEY: ${SPONSOR_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-passant}
    volumes:
      - passant-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  passant-db:
