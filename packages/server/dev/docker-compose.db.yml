# Development database only (M2 brief). The full application stack ships
# with M5. Usage: docker compose -f packages/server/dev/docker-compose.db.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 2s
      retries: 15
