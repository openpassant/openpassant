name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Start thor-solo (local VeChain node for adapter tests)
        run: |
          docker run -d --name thor-solo -p 127.0.0.1:8669:8669 \
            vechain/thor:v2.5.0 solo --on-demand --api-addr 0.0.0.0:8669 --api-cors '*'
          for i in $(seq 1 30); do
            curl -sf http://localhost:8669/blocks/0 >/dev/null && break
            sleep 1
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
        env:
          TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
          THOR_SOLO_URL: http://localhost:8669
      - run: pnpm lint
      - name: Validate compose files and build the server image
        run: |
          docker compose -f compose.yaml -f compose.solo.yaml config -q
          docker build -t passant .
      - name: Image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id passant -u)
          test "$uid" != "0"
