# Publishes @openpassant/core to npm via OIDC trusted publishing.
#
# How it works: npmjs.com is configured (package settings -> Trusted
# publisher) to trust THIS workflow file in THIS repository. When the
# workflow runs, GitHub gives it a short-lived, cryptographically signed
# identity token; npm verifies it and accepts the publish. No npm tokens
# exist anywhere - not in the repo, not in CI secrets, not on any machine -
# and npm attaches provenance attestations so users can verify the package
# was built from this repository at this commit.
#
# Releasing a new version:
#   1. Bump "version" in packages/core/package.json (with the changelog
#      commit), merge to main.
#   2. git tag core-vX.Y.Z && git push github core-vX.Y.Z
#   3. This workflow builds, tests against the normative vectors, checks
#      the tag matches the package version, and publishes.
name: release-core

on:
  push:
    tags:
      - 'core-v*'

permissions:
  contents: read
  id-token: write # the OIDC identity npm verifies; nothing else needs writing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Tag must match the package version
        run: |
          tag_version="${GITHUB_REF_NAME#core-v}"
          pkg_version=$(node -p "require('./packages/core/package.json').version")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "tag core-v$tag_version does not match packages/core version $pkg_version" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build and type-check core
        run: pnpm --filter @openpassant/core build

      # core's tests are self-contained (vectors from disk, a bundled build
      # in a bare VM sandbox) - no database, chain node or browser needed.
      - name: Test core against the normative vectors
        run: pnpm exec vitest run packages/core

      - name: Publish with provenance (OIDC trusted publishing)
        run: |
          npm install -g npm@latest # OIDC publish needs npm >= 11.5.1
          cd packages/core
          npm publish
